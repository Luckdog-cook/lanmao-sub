name: fox-analyze
on:
  workflow_dispatch:
jobs:
  an:
    runs-on: ubuntu-latest
    steps:
      - name: get and analyze
        run: |
          curl -sSL -m 300 -A "Mozilla/5.0" -o fox.apk "https://fastfoxapp.com/d/fox/fox_android.apk"
          ls -lh fox.apk
          mkdir -p out && cd out && unzip -oq ../fox.apk
          echo "=== LIB ==="
          ls -lh lib/arm64-v8a/ 2>/dev/null | awk '{print $9, $5}'
          echo "=== DEX ==="
          ls -lh *.dex 2>/dev/null | awk '{print $9, $5}'
          echo "=== ASSETS ==="
          ls assets 2>/dev/null | head -20
          echo "=== PROTOCOL KEYWORDS (lib) ==="
          for f in lib/arm64-v8a/*.so; do
            echo "--- $f"
            for k in vless vmess trojan shadowsocks hysteria wireguard reality sing-box xray; do
              n=$(strings -n 4 "$f" 2>/dev/null | grep -ci "$k" || true)
              [ "$n" -gt 0 ] && echo "  $k=$n"
            done
          done
          echo "=== GO MODULES ==="
          strings -n 10 lib/arm64-v8a/*.so 2>/dev/null | grep -E "^dep\s+(github|golang)" | sed 's/\s\+/ /g' | awk '{print $2, $3}' | sort -u | head -25
          echo "=== DOMAINS (libapp.so) ==="
          strings -n 6 lib/arm64-v8a/libapp.so 2>/dev/null | grep -oE "[a-z0-9][a-z0-9.-]{2,40}\.(com|net|io|cn|top|xyz|app|vip|cc)" | grep -viE "flutter|dart|w3|schema|googleapis|gstatic|apple" | sort | uniq -c | sort -rn | head -25
          echo "=== API PATHS ==="
          strings -n 5 lib/arm64-v8a/libapp.so 2>/dev/null | grep -oE "/(api|v1|v2|auth|user|node|server|sub|config)/[a-zA-Z0-9/_{}.-]{2,40}" | sort -u | head -40
          echo "=== DEX STRINGS ==="
          strings -n 6 *.dex 2>/dev/null | grep -iE "^(https?://|[a-z]+\.(com|net|io|cn)/)" | sort -u | head -20
