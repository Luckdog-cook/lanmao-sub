name: Update BEN Nodes

on:
  schedule:
    - cron: '0 */3 * * *'   # 每 3 小时
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run BEN fetch
        env:
          BEN_TOKEN: ${{ secrets.BEN_TOKEN }}
          OUTPUT_DIR: "."
          REQUEST_INTERVAL: "0.8"
        run: python ben.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add all_nodes_sharable_links.txt subscription_base64.txt all_outbounds_merged.json all_nodes_full_configs.json || true
          if git diff --staged --quiet; then
            echo "没有变化"
          else
            git commit -m "chore: update BEN nodes $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
