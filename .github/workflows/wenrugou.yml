name: wenrugou subscribe update
on:
  schedule:
    - cron: "13 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pyyaml

      - name: Generate
        run: |
          if [ -f "wenrugou.py" ]; then
            echo "Found wenrugou.py in root"
            python wenrugou.py
          elif [ -f "scripts/wenrugou.py" ]; then
            echo "Found wenrugou.py in scripts/"
            python scripts/wenrugou.py
          else
            echo "ERROR: wenrugou.py not found anywhere!"
            echo "--- Current root files ---"
            ls -la
            echo "--- Current scripts/ files ---"
            ls -la scripts/ || true
            exit 1
          fi

      - name: Copy to repo root
        run: |
          mkdir -p download/wenrugou
          # 兼容你的脚本可能输出到 download/wenrugou/ 或当前目录
          if [ -f "download/wenrugou/wenrugou.txt" ]; then
            cp -f "download/wenrugou/wenrugou.txt" "./wenrugou.txt"
            cp -f "download/wenrugou/clash_config.yaml" "./clash_config.yaml"
          elif [ -f "wenrugou.txt" ]; then
            echo "Files already in root"
          else
            echo "ERROR: Generated files not found!"
            exit 1
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A wenrugou.txt clash_config.yaml
          git diff --cached --quiet || git commit -m "chore: update wenrugou subscription"
          git push

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wenrugou-subscription
          path: |
            wenrugou.txt
            clash_config.yaml
          if-no-files-found: error
