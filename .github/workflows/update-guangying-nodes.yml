name: update guangying nodes

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download sslocal (静态二进制，固定版本，不解析 release)
        run: |
          curl -sL -o /tmp/ss.tar.xz \
            "https://github.com/shadowsocks/shadowsocks-rust/releases/download/v1.19.1/shadowsocks-rust-v1.19.1.x86_64-unknown-linux-gnu.tar.xz"
          tar -xJf /tmp/ss.tar.xz -C /tmp
          find /tmp -name sslocal -exec install -m 755 {} /usr/local/bin/sslocal \;
          sslocal --version
      - name: Run hunter
        run: python3 guangying.py
      - name: Commit & push
        run: |
          git config user.name "gy-bot"
          git config user.email "gy-bot@users.noreply.github.com"
          git add guangying.yml
          git commit -m "auto update nodes $(date -u '+%Y-%m-%d %H:%M')" --allow-empty
          git push
