name: update guangying nodes

on:
  schedule:
    # 每天检查一次; 脚本内部判断账号是否到期(2 天), 未到期直接跳过
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '强制重抓 (1=是)'
        required: false
        default: '0'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests pycryptodome
      - name: 下载 xray (实测真实出口)
        run: |
          curl -sL --retry 3 -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
          unzip -oq xray.zip xray && chmod +x xray && ./xray version | head -1
      - name: 抓取 + 归属校正
        env:
          XRAY_BIN: ./xray
          GY_FORCE: ${{ inputs.force }}
        run: python3 guangying.py
      - name: Commit & push
        if: always()
        run: |
          git config user.name "gy-bot"
          git config user.email "gy-bot@users.noreply.github.com"
          git add guangying.txt guangying_state.json 2>/dev/null || true
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "guangying: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
