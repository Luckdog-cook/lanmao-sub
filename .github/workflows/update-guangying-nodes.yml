name: update guangying nodes

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y shadowsocks-libev curl
      - name: Run hunter
        run: python3 guangying.py
      - name: Commit & push
        run: |
          git config user.name "gy-bot"
          git config user.email "gy-bot@users.noreply.github.com"
          git add guangying.yml
          git commit -m "auto update nodes $(date -u '+%Y-%m-%d %H:%M')" --allow-empty
          git push
