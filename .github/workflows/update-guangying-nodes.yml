name: update guangying nodes

on:
  schedule:
    - cron: '23 */8 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet requests pycryptodome
      - run: python3 guangying.py
      - name: Commit & push
        run: |
          git config user.name "gy-bot"
          git config user.email "gy-bot@users.noreply.github.com"
          git add guangying.txt
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "auto update nodes $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
