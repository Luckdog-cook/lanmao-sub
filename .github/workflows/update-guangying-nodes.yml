name: update guangying nodes

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone repo
        run: |
          git clone --depth 1 "https://github.com/${GITHUB_REPOSITORY}.git" .
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "gy-bot"
          git config user.email "gy-bot@users.noreply.github.com"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download sslocal (自动解析最新版)
        run: |
          set -e
          URL=$(curl -sL https://api.github.com/repos/shadowsocks/shadowsocks-rust/releases/latest | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for a in d.get('assets',[]):
              n=a['name']
              if 'x86_64-unknown-linux-gnu' in n and n.endswith('.tar.xz'):
                  print(a['browser_download_url']); break
          ")
          echo "download: $URL"
          curl -sL -o /tmp/ss.tar.xz "$URL"
          mkdir -p /tmp/ss
          tar -xJf /tmp/ss.tar.xz -C /tmp/ss
          ssbin=$(find /tmp/ss -type f -name sslocal | head -n1)
          install -m 755 "$ssbin" /usr/local/bin/sslocal
          sslocal --version
      - name: Debug connectivity (关键诊断)
        run: |
          echo "--- 直连目标 IP 测试（不经 sslocal）---"
          timeout 6 bash -c 'echo > /dev/tcp/43.159.7.5/21574' && echo "RESULT_21574=OPEN" || echo "RESULT_21574=BLOCKED"
          timeout 6 bash -c 'echo > /dev/tcp/43.159.7.5/443' && echo "RESULT_443=OPEN" || echo "RESULT_443=BLOCKED"
          echo "--- sslocal 单端口详细探测 ---"
          sslocal -s 43.159.7.5 -p 21574 -l 18080 -m aes-128-gcm -k 2wsxcde3 -t 5 > /tmp/sslog 2>&1 &
          sleep 3
          curl -s --socks5-hostname 127.0.0.1:18080 -m 9 https://www.cloudflare.com/cdn-cgi/trace || echo "CURL_PROBE=FAIL"
          echo "--- sslocal 日志（前几行）---"
          head -n 10 /tmp/sslog || true
      - name: Run hunter
        run: python3 guangying.py
      - name: Commit & push (无文件时跳过，不再红叉)
        run: |
          if test -f guangying.yml; then
            git add guangying.yml
            git commit -m "auto update nodes $(date -u '+%Y-%m-%d %H:%M')" --allow-empty
            git push origin HEAD:main
          else
            echo "no guangying.yml generated, skip push"
          fi
