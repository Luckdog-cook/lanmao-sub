name: 更新趣连订阅

on:
  schedule:
    - cron: '25 */4 * * *'          # 每4小时（错开蓝猫时间）
  workflow_dispatch:

concurrency:
  group: qulian-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25             # 趣连有验证码+大量节点，给更长时间

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 安装系统依赖 + Python 包
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          pip install --upgrade pip
          pip install pytesseract pycryptodome pillow

      - name: 运行趣连脚本（带重试）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 18
          max_attempts: 3                 # 验证码失败时自动重试最多3次
          retry_wait_seconds: 45
          command: python qulian.py
        # 如果需要更详细日志可加：python 趣连.py -v

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add nodes.txt nodes_sub_base64.txt subscription_info.txt 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: update qulian subscription $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 上传日志（失败时方便排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qulian-log
          path: |
            *.log
            nodes.txt
          retention-days: 3

      # ---------- 可选：失败通知 ----------
      # - name: 失败通知
      #   if: failure()
      #   run: |
      #     curl -X POST "https://api.day.app/${{ secrets.BARK_KEY }}/趣连订阅更新失败/请检查Actions日志"
