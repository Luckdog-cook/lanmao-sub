name: 更新 Dark 节点

on:
  schedule:
    # 每 6 小时（UTC 0 点和 6 点）
    - cron: '0 0,12 * * *'
  workflow_dispatch:          # 手机可手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -q curl_cffi cryptography

      - name: Fetch DarkVPN nodes
        run: |
          set -e
          python darkvpn_nodes.py -q -o .
          echo "节点行数:"
          wc -l dark_nodes.txt || true
          head -3 dark_nodes.txt || true

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_nodes.txt
          # 可选：也提交其他格式
          git add vless.txt hysteria2.txt sub_base64.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update dark_nodes.txt"
          git push
