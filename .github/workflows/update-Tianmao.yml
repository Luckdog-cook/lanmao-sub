name: 更新天猫订阅

on:
  schedule:
    - cron: '*/30 * * * *' # 每30分钟自动运行
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write # 必须有写权限，否则无法提交

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Tianmiao script
        run: |
          python3 "天喵.py"

      # 👇 👇 就是漏了这一步！把生成的文件复制给目标文件 👇 👇
      - name: 复制节点文件
        run: |
          cp nodes.txt flycat_nodes.txt
      # 👆 👆 就是漏了这一步！把生成的文件复制给目标文件 👆 👆

      - name: Commit and Push update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 删除可能残留的 nodes.json
          git rm -f nodes.json 2>/dev/null || true
          
          # 提交刚刚复制过来的新文件
          git add flycat_nodes.txt subscribe.txt
          
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "Auto update tianmiao nodes [skip ci]"
            git push
          fi
