name: fox-deep3
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: analyze
        run: |
          curl -sSL -m 300 -A "Mozilla/5.0" -o fox.apk "https://fastfoxapp.com/d/fox/fox_android.apk"
          mkdir -p out && cd out && unzip -oq ../fox.apk
          {
          echo "=== fox strings ==="
          strings -n 4 lib/arm64-v8a/libapp.so | grep -iE "fastfox|foxapp|ahaspeed|tyrant" | sort -u | head -25
          echo "=== all urls in libapp ==="
          strings -n 10 lib/arm64-v8a/libapp.so | grep -oE "https?://[a-zA-Z0-9./_-]{4,60}" | sort -u | head -30
          echo "=== tyrant symbols ==="
          strings -n 8 lib/arm64-v8a/libnetapi.so | grep -oE "tyrant[a-zA-Z0-9:_]{0,40}" | sort -u | head -20
          echo "=== netapi exported ==="
          strings -n 6 lib/arm64-v8a/libnetapi.so | grep -E "^(Java_|JNI_|netapi|api_)" | sort -u | head -20
          echo "=== assets 全部 ==="
          find assets -maxdepth 2 -type f 2>/dev/null | head -25
          echo "=== manifest meta ==="
          strings -n 6 AndroidManifest.xml | grep -oE "(com|net|app)\.[a-z0-9.]+" | sort -u | head -15
          } > ../report3.txt 2>&1
          cd .. && wc -c report3.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fox-report3
          path: report3.txt
