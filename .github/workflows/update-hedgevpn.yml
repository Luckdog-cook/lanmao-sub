name: 更新刺猬VPN节点

on:
  schedule:
    # 试用期 60 分钟，每 30 分钟重新注册一次，留 30 分钟重叠量。
    # 注意：不能用 */40 —— GitHub 的调度器对不能整除 60 的 */N 会直接不触发，
    # 必须显式列举分钟；错开整点（0 分是全网最拥堵时刻）用 5 分和 35 分。
    - cron: "5,35 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hedgevpn-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install --quiet pycryptodome pyyaml requests

      - name: 抓取节点（自动注册试用号）
        env:
          # 可选：留空则每次自动注册新号（60 分钟全地区试用）
          HEDGE_ACCOUNT: ${{ secrets.HEDGE_ACCOUNT }}
          HEDGE_PASSWORD: ${{ secrets.HEDGE_PASSWORD }}
          OUT_DIR: .
        run: python hedgevpn.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hedgevpn_nodes.txt hedgevpn_sub_b64.txt hedgevpn_singbox.json hedgevpn_clash.yaml hedgevpn_meta.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update hedgevpn nodes $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 刷新 jsDelivr 缓存
        run: |
          FILES="hedgevpn_nodes.txt hedgevpn_sub_b64.txt hedgevpn_singbox.json hedgevpn_clash.yaml hedgevpn_meta.json"
          # jsDelivr 的 @main 是分支引用，缓存很顽固：单次 purge 往往刷不掉，
          # 必须多轮 + 间隔，最后再校验一次。
          for round in 1 2 3; do
            for f in $FILES; do
              curl -s --max-time 20 "https://purge.jsdelivr.net/gh/Luckdog-cook/lanmao-sub@main/$f" > /dev/null || true
            done
            echo "purge round $round done"
            sleep 8
          done

          EXPECT=$(python3 -c "import json;print(json.load(open('hedgevpn_meta.json'))['updated'])")
          for i in 1 2 3 4 5 6; do
            GOT=$(curl -s --max-time 15 "https://cdn.jsdelivr.net/gh/Luckdog-cook/lanmao-sub@main/hedgevpn_meta.json" \
                  | python3 -c "import sys,json;print(json.load(sys.stdin)['updated'])" 2>/dev/null || echo "")
            if [ "$GOT" = "$EXPECT" ]; then
              echo "✔ jsDelivr 已刷新: $GOT"
              exit 0
            fi
            echo "缓存仍是 [$GOT]，期望 [$EXPECT]，20s 后重试"
            sleep 20
          done
          echo "::warning::jsDelivr 缓存未在预期时间内刷新，GitHub Pages / raw 通道不受影响"
