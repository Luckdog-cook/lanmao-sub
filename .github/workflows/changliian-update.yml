name: 畅连节点更新

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 生成带畅连标签的节点
        run: |
          mkdir -p out pages
          python netsub_server.py --once --out ./out
          if [ -f out/nodes.txt ]; then
            sed 's/#/#畅连-/g' out/nodes.txt > out/nodes_labeled.txt
            base64 -w 0 out/nodes_labeled.txt > pages/畅连.txt
          else
            echo "" > pages/畅连.txt
          fi
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          force_orphan: true
