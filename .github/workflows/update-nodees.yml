name: 自动更新火种节点订阅

on:
  schedule:
    - cron: '0 */3 * * *'   # 每3小时，可改成 0 */1 * * *（每1小时）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests urllib3

      - name: 运行节点提取
        env:
          HUOZHONG_USERNAME: ${{ secrets.HUOZHONG_USERNAME }}
          HUOZHONG_PASSWORD: ${{ secrets.HUOZHONG_PASSWORD }}
        run: python extract_nodes.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新节点 $(date +'%Y-%m-%d %H:%M')"
          git push
