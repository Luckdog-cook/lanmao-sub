name: 更新蜂鸟订阅

# ============================================================
# 蜂鸟加速器 - GitHub Actions 自动更新工作流
#
# 设计目标：无缝衔接，账号不会过期断档
#
# 核心机制（全在脚本里，工作流只负责调度 + 提交）:
#   1. 脚本自动存 fengniao_account.json（serial + vipEndTime）
#   2. 每次运行先查 vipEndTime，快过期就自动换新号
#   3. 复用旧号失败 → 清账号文件 → 下次自动换号
#   4. 工作流每 3 小时跑一次 + 外层重试 3 次
#   5. 只有节点真正变化才 commit
#
# 不依赖猜有效期——直接用 API 返回的 vipEndTime 时间戳判断
# ============================================================

on:
  schedule:
    # 每 3 小时运行一次（UTC 时间）
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_new:
        description: '强制生成新账号'
        required: false
        type: boolean
        default: false

concurrency:
  group: fengniao-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pycryptodome

      # 脚本自己会：
      #   1. 读 fengniao_account.json → 查 vipEndTime → 快过期就自动换号
      #   2. 复用旧号失败 → 清账号文件 → 下次自动换号
      #   3. 拉节点 + 输出 4 个文件 + 更新 account 文件
      # 外层重试 3 次应对偶发网络抖动
      - name: 运行蜂鸟脚本
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 60
          command: |
            if [ "${{ github.event.inputs.force_new }}" = "true" ]; then
              python fengniao_sign.py --force-new --delay=2.0
            else
              python fengniao_sign.py --delay=2.0
            fi

      - name: 提交更新
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 蜂鸟脚本输出:
          #   fengniao_nodes.json    - 节点 JSON
          #   节点链接.txt           - 明文 Trojan 链接
          #   sub.txt                - Base64 订阅
          #   clash.yaml             - Clash Meta 配置
          #   fengniao_account.json  - 账号信息（serial + vipEndTime，跨次复用）
          git add fengniao_nodes.json "节点链接.txt" sub.txt clash.yaml fengniao_account.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "📋 内容无变化，跳过提交"
          else
            git commit -m "chore(fengniao): update subscription $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ 已提交更新"
          fi
