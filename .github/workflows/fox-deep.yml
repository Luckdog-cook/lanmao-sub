name: fox-deep
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: analyze
        run: |
          curl -sSL -m 300 -A "Mozilla/5.0" -o fox.apk "https://fastfoxapp.com/d/fox/fox_android.apk"
          mkdir -p out && cd out && unzip -oq ../fox.apk
          echo "=== libnetapi.so 关键字符串 ==="
          strings -n 5 lib/arm64-v8a/libnetapi.so | grep -iE "wireguard|wg|ipsec|ikev2|strongswan|openvpn|quic|hysteria|vless|vmess|trojan|shadowsocks|reality|tls|handshake|protocol|tunnel" | sort | uniq -c | sort -rn | head -30
          echo "=== libnetapi.so 域名 ==="
          strings -n 6 lib/arm64-v8a/libnetapi.so | grep -oE "[a-z0-9][a-z0-9.-]{2,40}\.(com|net|io|cn|top|xyz|app|vip|cc|org)" | sort | uniq -c | sort -rn | head -15
          echo "=== libnetapi.so URL/路径 ==="
          strings -n 6 lib/arm64-v8a/libnetapi.so | grep -E "^(/|https?://)" | head -20
          echo "=== libapp.so 域名（全部） ==="
          strings -n 6 lib/arm64-v8a/libapp.so | grep -oE "[a-z0-9][a-z0-9.-]{2,40}\.(com|net|io|cn|top|xyz|app|vip|cc)" | sort | uniq -c | sort -rn | head -30
          echo "=== libapp.so API 路径 ==="
          strings -n 5 lib/arm64-v8a/libapp.so | grep -oE "/(api|v1|v2|auth|user|node|server|sub|config|vpn)/[a-zA-Z0-9/_{}.-]{2,40}" | sort -u | head -40
          echo "=== assets ==="
          find assets -maxdepth 2 -type f 2>/dev/null | head -20
