name: 更新飞梭加速器节点

on:
  schedule:
    # 每 2 小时触发两次（GitHub 调度经常延迟/丢弃，双份兜底）
    - cron: "7 */2 * * *"
    - cron: "37 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fayso-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 飞梭的节点密码按设备生成，且每个设备只有 2 小时试用额度。
      # 复用旧设备会让订阅里的凭据一直不变、额度被耗尽，所以每次强制换新设备。
      - name: 清理旧设备会话
        run: rm -f .fayso_session.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成订阅
        env:
          # 三个都可选，留空则自动匿名注册设备
          FAYSO_TOKEN: ${{ secrets.FAYSO_TOKEN }}
          FAYSO_USERNAME: ${{ secrets.FAYSO_USERNAME }}
          FAYSO_PASSWORD: ${{ secrets.FAYSO_PASSWORD }}
        run: python fayso.py

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fayso_sub.txt fayso_sub_b64.txt fayso_clash.yaml fayso_singbox.json fayso_nodes.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update fayso nodes $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # jsDelivr 对分支引用有 CDN 缓存，主动刷新让订阅立即生效
      - name: 刷新 jsDelivr 缓存
        run: |
          for f in fayso_sub.txt fayso_sub_b64.txt fayso_clash.yaml fayso_singbox.json fayso_nodes.json; do
            if curl -s --max-time 20 "https://purge.jsdelivr.net/gh/Luckdog-cook/lanmao-sub@main/$f" > /dev/null; then
              echo "purged $f"
            else
              echo "purge failed $f (忽略)"
            fi
          done
