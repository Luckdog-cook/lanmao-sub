name: 更新蓝猫订阅

on:
  schedule:
    - cron: '15 */4 * * *'          # 保留默认4小时运行，实际主要靠外挂 cron-job.org 45分钟触发
  workflow_dispatch:                # 支持手动触发

concurrency:
  group: lanmao-update
  cancel-in-progress: true          # 有新任务时取消旧的，防止堆积

permissions:
  contents: write                   # 【极其重要】必须要有写权限，否则 git push 会失败

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10             # 整体超时10分钟

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 【注意】千万不能写 cache: 'pip'，否则会因为没有 requirements.txt 而报错

      - name: 安装依赖（如有）
        run: |
          pip install --upgrade pip
          # 蓝猫脚本是纯标准库，无需额外包

      - name: 运行脚本（带重试）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 30
          command: python 蓝猫VPN.py auto
        env:
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          VPN_ENCRYPT_KEY: ${{ secrets.VPN_ENCRYPT_KEY }}
          VPN_TEST_LATENCY: "0"     # 【核心修改】强制关闭Actions端测速，全量抓取所有节点

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 确保这里的文件名和 Python 脚本输出文件名完全一致
          git add bluecat_nodes_base64.txt nodes.txt subscription_info.txt clash.yaml token.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "内容无变化，跳过提交"
          else
            git commit -m "chore: update subscription $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      # ---------- 可选：如果你的手机端用 jsDelivr，可以加上这步刷新缓存 ----------
      # - name: Purge jsDelivr cache
      #   run: |
      #     curl -s "https://purge.jsdelivr.net/gh/Luckdog-cook/lanmao-sub@main/bluecat_nodes_base64.txt"
