name: 更新订阅
on:
  schedule:
    - cron: '20 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行
        env:
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          VPN_ENCRYPT_KEY: ${{ secrets.VPN_ENCRYPT_KEY }}
        run: python 蓝猫VPN.py auto
      - name: 提交
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nodes.txt nodes_sub_base64.txt subscription_info.txt clash.yaml token.json || true
          git diff --staged --quiet || (git commit -m "update $(date -u +%Y%m%d-%H%M)" && git push)
