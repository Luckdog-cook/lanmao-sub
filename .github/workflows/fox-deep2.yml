name: fox-deep2
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: analyze
        run: |
          curl -sSL -m 300 -A "Mozilla/5.0" -o fox.apk "https://fastfoxapp.com/d/fox/fox_android.apk"
          mkdir -p out && cd out && unzip -oq ../fox.apk
          {
          echo "=== netapi protocol ==="
          strings -n 5 lib/arm64-v8a/libnetapi.so | grep -iE "udp_and_tls|ech|reality|vless|vmess|hysteria|wireguard|quic|lwip|kcp|tcp_and|fragment|obfs|padding" | sort | uniq -c | sort -rn | head -25
          echo "=== netapi urls ==="
          strings -n 8 lib/arm64-v8a/libnetapi.so | grep -E "https?://" | sort -u | head -20
          echo "=== netapi paths ==="
          strings -n 6 lib/arm64-v8a/libnetapi.so | grep -E "^/(api|v1|v2|user|node|server|sub|config|vpn|auth)" | sort -u | head -25
          echo "=== app domains ==="
          strings -n 6 lib/arm64-v8a/libapp.so | grep -oE "[a-z0-9][a-z0-9.-]{2,40}\.(com|net|io|cn|top|xyz|app|vip|cc)" | grep -viE "flutter|dart|w3|schema|googleapis|gstatic|apple|android" | sort | uniq -c | sort -rn | head -25
          echo "=== app api paths ==="
          strings -n 5 lib/arm64-v8a/libapp.so | grep -oE "/(api|v1|v2|auth|user|node|server|sub|config|vpn)/[a-zA-Z0-9/_{}.-]{2,40}" | sort -u | head -40
          echo "=== assets ==="
          find assets -maxdepth 2 -type f 2>/dev/null | head -15
          echo "=== dex urls ==="
          strings -n 8 *.dex 2>/dev/null | grep -oE "https?://[a-zA-Z0-9.-]+\.[a-z]{2,10}[^\"' ]*" | sort -u | head -15
          } > ../report.txt 2>&1
          cd .. && wc -l report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fox-report
          path: report.txt
