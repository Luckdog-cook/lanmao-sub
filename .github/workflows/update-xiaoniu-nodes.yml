name: update xiaoniu nodes

on:
  schedule:
    - cron: '49 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 下载 xray (实测)
        run: |
          curl -sL --retry 3 -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
          unzip -oq xray.zip xray && chmod +x xray && ./xray version | head -1
      - name: 抓取 + 实测
        env:
          XRAY_BIN: ./xray
        run: python3 xiaoniu.py
      - name: Commit & push
        if: always()
        run: |
          git config user.name "xn-bot"
          git config user.email "xn-bot@users.noreply.github.com"
          git add -f xiaoniu_state.json xiaoniu_sub.txt xiaoniu_nodes.txt xiaoniu_clash.yaml 2>/dev/null || true
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "xiaoniu: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
