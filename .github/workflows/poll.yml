name: 更新小满/Vela 节点

on:
  schedule:
    - cron: '0 */6 * * *'      # 每 6 小时（UTC）
  workflow_dispatch:           # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # 完整历史，便于并发推送时 rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -q requests cryptography pyyaml

      - name: Fetch 小满节点
        env:
          XIAOMAN_TOKEN:    ${{ secrets.XIAOMAN_TOKEN }}
          XIAOMAN_KEY_B64:  ${{ secrets.XIAOMAN_KEY_B64 }}
          XIAOMAN_BASE:     ${{ secrets.XIAOMAN_BASE }}
          XIAOMAN_PLATFORM: ${{ secrets.XIAOMAN_PLATFORM }}
          XIAOMAN_ROUTING:  ${{ secrets.XIAOMAN_ROUTING }}
        run: python xiaoman_poller.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscription
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update 小满/Vela 订阅 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase --autostash origin main
          git push
