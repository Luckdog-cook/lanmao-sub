name: update-redmouse-nodes
on:
  schedule:
    - cron: '17 2,14 * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取节点
        run: python3 redmouse_nodes.py --reuse --check
      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add redmouse_nodes.txt redmouse_nodes.base64 redmouse_account.json
          if git diff --cached --quiet; then echo "无变化"; exit 0; fi
          git commit -m "chore(redmouse): 刷新节点 $(date -u '+%Y-%m-%d %H:%M UTC')"
          ok=0
          for i in 1 2 3; do
            if git push; then ok=1; break; fi
            git fetch origin main || true
            git merge -X ours --no-edit origin/main || true
            sleep 3
          done
          [ "$ok" = "1" ] || exit 1
