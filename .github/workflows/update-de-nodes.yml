name: 更新de订阅

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时自动运行一次
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4 # 修复此处：删除了 bootstrapped-
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install cryptography

      - name: Run DeVPN script
# 使用 -U 确保脚本在写入文件时使用 UTF-8 编码，防止中文乱码导致 Base64 错误
        run: |
          python3 -U devpn.py

      - name: Commit and Push update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add nodes.txt last_account.json
          git commit -m "Auto update nodes [cite: 1]" || exit 0
          git push
