name: Update YesVPN Nodes

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch YesVPN nodes
        run: |
          python fetch_yesvpn.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- yesvpn_nodes.txt; then
            echo "无变化"
            exit 0
          fi
          git add yesvpn_nodes.txt
          git commit -m "chore: update yesvpn_nodes.txt"
          git push
