name: 更新 iPoW 节点

on:
  schedule:
    - cron: '0 0,5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -q requests eth-account cryptography

      # 跑仓库里的 ipow_nodes.py（更新后的新脚本，融合 v2 全功能 + v1 订阅输出）
      # -o . 把输出锁到仓库根目录（否则会落到 ~/Downloads 找不到文件）
      # 不需要任何 Secrets：脚本会自动注册钱包拉取（与本地运行一致）
      - name: Fetch iPoW nodes
        run: |
          set -e
          python ipow_nodes.py --quiet -o . || true
          if [ -f ipow.txt ]; then
            echo "订阅节点行数:"
            wc -l ipow.txt
            head -3 ipow.txt
          else
            echo "未生成 ipow.txt"
            exit 1
          fi

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ipow.txt
          git add all_nodes_vless.txt all_nodes_hy2.txt all_nodes.json \
                  clash_proxies.yaml singbox_outbounds.json node_ip_map.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update ipow.txt"
          git push
