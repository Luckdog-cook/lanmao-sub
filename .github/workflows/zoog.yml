name: Zoog Update

on:
  schedule:
    - cron: '0 20 * * *'   # UTC 20:00 = 北京时间 04:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pycryptodome

      - name: Run zoog.py
        env:
          ZOOG_EMAIL:    ${{ secrets.ZOOG_EMAIL }}
          ZOOG_PASSWORD: ${{ secrets.ZOOG_PASSWORD }}
        run: python zoog.py

      - name: Commit to GitHub
        run: |
          git config user.name  github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add output/
          git diff --staged --quiet || git commit -m "update $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git push

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy output/ --project-name=zoog-sub
