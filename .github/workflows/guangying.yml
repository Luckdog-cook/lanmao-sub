name: 光影VPN 自动节点猎手（每天 02:00 运行）

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq masscan nmap curl python3
          which python3 && python3 --version

      - name: Run guangying
        run: |
          cd ~/gy-hunter
          chmod +x guangying.py
          ./guangying.py
