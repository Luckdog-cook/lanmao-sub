name: update telescope nodes

on:
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 下载 mihomo 内核 (仅手动全量模式)
        if: github.event_name != 'schedule'
        run: |
          curl -sL --retry 3 -o mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          gunzip -c mihomo.gz > mihomo && chmod +x mihomo && ./mihomo -v | head -1
      - name: 抓取 + 换号 (定时=快速约1分钟 / 手动=全量实测约5分钟)
        env:
          MIHOMO_BIN: ./mihomo
          TELESCOPE_FAST: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: |
          pip install pyyaml requests -q
          python3 telescope.py
      - name: Commit & push
        if: always()
        run: |
          git config user.name "tel-bot"
          git config user.email "tel-bot@users.noreply.github.com"
          git add -f telescope_state.json telescope_sub.txt telescope_nodes.txt telescope_clash.yaml 2>/dev/null || true
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "telescope: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
