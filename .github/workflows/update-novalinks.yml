name: update-novalinks

on:
  schedule:
    # 每天一次。账号刷满 192h(24h 试用 + 7 天广告) 后, 之后每天只做一次秒级检查
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novalinks
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 首次刷满 192h 需要约 3.5 小时 (384 次 x 31s)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install --quiet pyyaml

      - name: 下载 xray (节点实测)
        run: |
          curl -sL --retry 3 -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/download/v25.9.11/Xray-linux-64.zip
          unzip -oq xray.zip xray
          chmod +x xray
          ./xray version | head -1

      - name: 抓取 + 续时长
        env:
          XRAY_BIN: ./xray
          NOVA_STATE: novalinks_state.json
        run: python3 novalinks.py --probe --target 192 --refresh-below 12

      - name: 提交
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f novalinks_state.json novalinks_sub.yaml novalinks_nodes.txt novalinks_singbox.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          git commit -m "novalinks: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            git push && break
            sleep 8
          done
