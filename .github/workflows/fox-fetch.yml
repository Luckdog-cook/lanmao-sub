name: fox-fetch
on:
  workflow_dispatch:
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - name: download
        run: |
          curl -sSL -m 300 -A "Mozilla/5.0" -o fox.apk "https://fastfoxapp.com/d/fox/fox_android.apk" -w "http=%{http_code} size=%{size_download}\n"
          ls -lh fox.apk
          sha256sum fox.apk
          file fox.apk
          mkdir -p out
          python3 - <<'PY'
          import zipfile
          z=zipfile.ZipFile('fox.apk')
          names=[n for n in z.namelist() if n.endswith('.dex') or n.endswith('libapp.so') or n.endswith('AndroidManifest.xml')]
          for n in names:
              if z.getinfo(n).file_size > 60*1024*1024: continue
              z.extract(n, 'out')
              print("extract", n, z.getinfo(n).file_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fox-parts
          path: out/
          compression-level: 9
