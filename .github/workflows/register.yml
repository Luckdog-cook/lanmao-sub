name: Huozhong Register

on:
  workflow_dispatch:   # 只支持手动触发（防止乱注册）

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-tesseract-${{ runner.os }}-v1

      - name: Install system deps (tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng libtesseract-dev
          echo "=== 版本 ==="
          tesseract --version
          echo "=== 可用语言 ==="
          tesseract --list-langs
          echo "=== 可执行文件路径 ==="
          which tesseract

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow pytesseract

      - name: Run register
        env:
          REGISTER_COUNT: "3"
          TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
          PYTHONUNBUFFERED: "1"
        run: python huozhong_register.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-logs-${{ github.run_number }}
          path: |
            *.log
            *.png
          if-no-files-found: ignore
          retention-days: 7
