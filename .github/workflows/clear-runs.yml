name: 自动清理工作流记录

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨 0 点自动执行
  workflow_dispatch: # 支持手动点击运行

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write # 必须加这一行，否则没有权限删除记录
    steps:
      - name: 删除旧的工作流记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 1          # 保留最近 1 天的记录（可以改成 3 或 7）
          keep_minimum_runs: 2    # 每个工作流至少保留最后 2 条记录，方便排错
