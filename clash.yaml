mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxy-providers:
  蓝猫:
    type: http
    url: "https://raw.githubusercontent.com/你的用户名/仓库名/main/nodes_sub_base64.txt"
    interval: 3600
    path: ./providers/蓝猫.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxies: []

proxy-groups:
  - name: 🚀 节点选择
    type: select
    use:
      - 蓝猫
    proxies:
      - ♻️ 自动选择
      - DIRECT
  - name: ♻️ 自动选择
    type: url-test
    use:
      - 蓝猫
    url: http://www.gstatic.com/generate_204
    interval: 300

rules:
  - GEOIP,CN,DIRECT
  - MATCH,🚀 节点选择
